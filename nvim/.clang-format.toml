Language = "Cpp"
# BasedOnStyle = "LLVM"
AccessModifierOffset = -2
AlignAfterOpenBracket = "Align"
AlignArrayOfStructures = "None"
AlignConsecutiveAssignments.Enabled = false
AlignConsecutiveAssignments.AcrossEmptyLines = false
AlignConsecutiveAssignments.AcrossComments = false
AlignConsecutiveAssignments.AlignCompound = false
AlignConsecutiveAssignments.PadOperators = true
AlignConsecutiveBitFields.Enabled = false
AlignConsecutiveBitFields.AcrossEmptyLines = false
AlignConsecutiveBitFields.AcrossComments = false
AlignConsecutiveBitFields.AlignCompound = false
AlignConsecutiveBitFields.PadOperators = false
AlignConsecutiveDeclarations.Enabled = false
AlignConsecutiveDeclarations.AcrossEmptyLines = false
AlignConsecutiveDeclarations.AcrossComments = false
AlignConsecutiveDeclarations.AlignCompound = false
AlignConsecutiveDeclarations.PadOperators = false
AlignConsecutiveMacros.Enabled = false
AlignConsecutiveMacros.AcrossEmptyLines = false
AlignConsecutiveMacros.AcrossComments = false
AlignConsecutiveMacros.AlignCompound = false
AlignConsecutiveMacros.PadOperators = false
AlignEscapedNewlines = "Right"
AlignOperands = "Align"
AlignTrailingComments.Kind = "Always"
AlignTrailingComments.OverEmptyLines = 0
AllowAllArgumentsOnNextLine = true
AllowAllParametersOfDeclarationOnNextLine = true
AllowShortBlocksOnASingleLine = "Never"
AllowShortCaseLabelsOnASingleLine = false
AllowShortEnumsOnASingleLine = true
AllowShortFunctionsOnASingleLine = "All"
AllowShortIfStatementsOnASingleLine = "Never"
AllowShortLambdasOnASingleLine = "All"
AllowShortLoopsOnASingleLine = false
AlwaysBreakAfterDefinitionReturnType = "None"
AlwaysBreakAfterReturnType = "None"
AlwaysBreakBeforeMultilineStrings = false
AlwaysBreakTemplateDeclarations = "MultiLine"
AttributeMacros = ["__capability"]
BinPackArguments = true
BinPackParameters = true
BitFieldColonSpacing = "Both"
BraceWrapping.AfterCaseLabel = false
BraceWrapping.AfterClass = false
BraceWrapping.AfterControlStatement = "Never"
BraceWrapping.AfterEnum = false
BraceWrapping.AfterExternBlock = false
BraceWrapping.AfterFunction = false
BraceWrapping.AfterNamespace = false
BraceWrapping.AfterObjCDeclaration = false
BraceWrapping.AfterStruct = false
BraceWrapping.AfterUnion = false
BraceWrapping.BeforeCatch = false
BraceWrapping.BeforeElse = false
BraceWrapping.BeforeLambdaBody = false
BraceWrapping.BeforeWhile = false
BraceWrapping.IndentBraces = false
BraceWrapping.SplitEmptyFunction = true
BraceWrapping.SplitEmptyRecord = true
BraceWrapping.SplitEmptyNamespace = true
BreakAfterAttributes = "Never"
BreakAfterJavaFieldAnnotations = false
BreakArrays = true
BreakBeforeBinaryOperators = "None"
BreakBeforeConceptDeclarations = "Always"
BreakBeforeBraces = "Attach"
BreakBeforeInlineASMColon = "OnlyMultiline"
BreakBeforeTernaryOperators = true
BreakConstructorInitializers = "BeforeColon"
BreakInheritanceList = "BeforeColon"
BreakStringLiterals = true
ColumnLimit = 80
CommentPragmas = '^ IWYU pragma:'
CompactNamespaces = false
ConstructorInitializerIndentWidth = 4
ContinuationIndentWidth = 4
Cpp11BracedListStyle = true
DerivePointerAlignment = false
DisableFormat = false
EmptyLineAfterAccessModifier = "Never"
EmptyLineBeforeAccessModifier = "LogicalBlock"
ExperimentalAutoDetectBinPacking = false
FixNamespaceComments = true
ForEachMacros = ["foreach", "Q_FOREACH", "BOOST_FOREACH"]
IfMacros = ["KJ_IF_MAYBE"]
IncludeBlocks = "Preserve"
IncludeCategories = [
  { Regex = '^"(llvm|llvm-c|clang|clang-c)/', Priority = 2, SortPriority = 0, CaseSensitive = false },
  { Regex = '^(<|"(gtest|gmock|isl|json)/)', Priority = 3, SortPriority = 0, CaseSensitive = false },
  { Regex = '.*', Priority = 1, SortPriority = 0, CaseSensitive = false }
]
IncludeIsMainRegex = '(Test)?$'
IncludeIsMainSourceRegex = ''
IndentAccessModifiers = false
IndentCaseBlocks = false
IndentCaseLabels = false
IndentExternBlock = "AfterExternBlock"
IndentGotoLabels = true
IndentPPDirectives = "None"
IndentRequiresClause = true
IndentWidth = 2
IndentWrappedFunctionNames = false
InsertBraces = false
InsertNewlineAtEOF = false
InsertTrailingCommas = "None"
IntegerLiteralSeparator.Binary = 0
IntegerLiteralSeparator.BinaryMinDigits = 0
IntegerLiteralSeparator.Decimal = 0
IntegerLiteralSeparator.DecimalMinDigits = 0
IntegerLiteralSeparator.Hex = 0
IntegerLiteralSeparator.HexMinDigits = 0
JavaScriptQuotes = "Leave"
JavaScriptWrapImports = true
KeepEmptyLinesAtTheStartOfBlocks = true
LambdaBodyIndentation = "Signature"
LineEnding = "DeriveLF"
MacroBlockBegin = ''
MacroBlockEnd = ''
MaxEmptyLinesToKeep = 1
NamespaceIndentation = "None"
ObjCBinPackProtocolList = "Auto"
ObjCBlockIndentWidth = 2
ObjCBreakBeforeNestedBlockParam = true
ObjCSpaceAfterProperty = false
ObjCSpaceBeforeProtocolList = true
PackConstructorInitializers = "BinPack"
PenaltyBreakAssignment = 2
PenaltyBreakBeforeFirstCallParameter = 19
PenaltyBreakComment = 300
PenaltyBreakFirstLessLess = 120
PenaltyBreakOpenParenthesis = 0
PenaltyBreakString = 1000
PenaltyBreakTemplateDeclaration = 10
PenaltyExcessCharacter = 1000000
PenaltyIndentedWhitespace = 0
PenaltyReturnTypeOnItsOwnLine = 60
PointerAlignment = "Right"
PPIndentWidth = -1
QualifierAlignment = "Leave"
ReferenceAlignment = "Pointer"
ReflowComments = true
RemoveBracesLLVM = false
RemoveSemicolon = false
RequiresClausePosition = "OwnLine"
RequiresExpressionIndentation = "OuterScope"
SeparateDefinitionBlocks = "Leave"
ShortNamespaceLines = 1
SortIncludes = "CaseSensitive"
SortJavaStaticImport = "Before"
SortUsingDeclarations = "LexicographicNumeric"
SpaceAfterCStyleCast = false
SpaceAfterLogicalNot = false
SpaceAfterTemplateKeyword = true
SpaceAroundPointerQualifiers = "Default"
SpaceBeforeAssignmentOperators = true
SpaceBeforeCaseColon = false
SpaceBeforeCpp11BracedList = false
SpaceBeforeCtorInitializerColon = true
SpaceBeforeInheritanceColon = true
SpaceBeforeParens = "ControlStatements"
SpaceBeforeParensOptions.AfterControlStatements = true
SpaceBeforeParensOptions.AfterForeachMacros = true
SpaceBeforeParensOptions.AfterFunctionDefinitionName = false
SpaceBeforeParensOptions.AfterFunctionDeclarationName = false
SpaceBeforeParensOptions.AfterIfMacros = true
SpaceBeforeParensOptions.AfterOverloadedOperator = false
SpaceBeforeParensOptions.AfterRequiresInClause = false
SpaceBeforeParensOptions.AfterRequiresInExpression = false
SpaceBeforeParensOptions.BeforeNonEmptyParentheses = false
SpaceBeforeRangeBasedForLoopColon = true
SpaceBeforeSquareBrackets = false
SpaceInEmptyBlock = false
SpaceInEmptyParentheses = false
SpacesBeforeTrailingComments = 1
SpacesInAngles = "Never"
SpacesInConditionalStatement = false
SpacesInContainerLiterals = true
SpacesInCStyleCastParentheses = false
SpacesInLineCommentPrefix.Minimum = 1
SpacesInLineCommentPrefix.Maximum = -1
SpacesInParentheses = false
SpacesInSquareBrackets = false
Standard = "Latest"
StatementAttributeLikeMacros = ["Q_EMIT"]
StatementMacros = ["Q_UNUSED", "QT_REQUIRE_VERSION"]
TabWidth = 8
UseTab = "Never"
WhitespaceSensitiveMacros = ["BOOST_PP_STRINGIZE", "CF_SWIFT_NAME", "NS_SWIFT_NAME", "PP_STRINGIZE", "STRINGIZE"]
